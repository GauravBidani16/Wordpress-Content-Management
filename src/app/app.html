<mat-toolbar class="toolbar">
  <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="toolbar-title">WP Admin</span>
  <span class="toolbar-spacer"></span>

  <!-- Connection status indicator -->
  @if (auth.isAuthenticated()) {
    <span class="connection-badge connected">Connected</span>
  } @else {
    <span class="connection-badge disconnected">Not Connected</span>
  }

  <!-- Theme toggle -->
  <button mat-icon-button (click)="theme.toggle()"
    [matTooltip]="theme.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
    <mat-icon>{{ theme.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<!-- Global loading bar -->
@if (loading.isLoading()) {
  <mat-progress-bar mode="indeterminate" class="global-loader"></mat-progress-bar>
}

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="sidenavOpen"
    (closed)="sidenavOpen = false"
    class="sidenav">

    <div class="sidenav-header">
      <mat-icon class="sidenav-logo">dashboard</mat-icon>
      <span>WordPress Admin</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/posts" routerLinkActive="active-link"
        (click)="isMobile && toggleSidenav()">
        <mat-icon matListItemIcon>article</mat-icon>
        <span matListItemTitle>Posts</span>
      </a>
      <a mat-list-item routerLink="/posts/create" routerLinkActive="active-link"
        (click)="isMobile && toggleSidenav()">
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <span matListItemTitle>Create Post</span>
      </a>
      <a mat-list-item routerLink="/settings" routerLinkActive="active-link"
        (click)="isMobile && toggleSidenav()">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Settings</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <div class="content-wrapper">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
